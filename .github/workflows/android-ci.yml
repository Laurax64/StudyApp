name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    uses: ./.github/workflows/android-setup.yml
    with:
      gradle-task: "build -x lint -x test"

  lint:
    uses: ./.github/workflows/android-setup.yml
    with:
      gradle-task: "lint"

  test:
    uses: ./.github/workflows/android-setup.yml
    with:
      gradle-task: "test"

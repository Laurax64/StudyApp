name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [ build, lint, test ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Gradle task
        run: |
          if [ "${{ matrix.task }}" == "build" ]; then
            ./gradlew build -x lint -x test
          elif [ "${{ matrix.task }}" == "lint" ]; then
            ./gradlew lint
          else
            ./gradlew test
          fi

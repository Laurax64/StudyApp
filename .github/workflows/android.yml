name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  before:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

  build:
    runs-on: ubuntu-latest
    needs: before
    steps:
      - name: Build with gradle
        run: ./gradlew build -x lint -x test

  lint:
    runs-on: ubuntu-latest
    needs: before
    steps:
      - name: Check lint
        run: ./gradlew lint

  test:
    runs-on: ubuntu-latest
    needs: before
    steps:
      - name: Run local tests
        run: ./gradlew test
